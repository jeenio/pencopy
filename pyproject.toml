[project]
name = "pencopy"
version = "1.0.0"
description = "Ferramenta de cópia em massa para pendrives"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7",
    "xxhash>=3.4",
    "psutil>=5.9",
]

[project.scripts]
pencopy = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
